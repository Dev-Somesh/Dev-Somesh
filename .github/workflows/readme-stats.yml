name: Update README Stats Cards

on:
  schedule:
    - cron: "0 4 * * *"   # daily at 04:00 UTC
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/readme-stats.yml

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_border=true&bg_color=0d1117&title_color=10B981&icon_color=F59E0B&text_color=6EE7B7&ring_color=10B981
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&hide_border=true&bg_color=0d1117&title_color=10B981&text_color=6EE7B7&langs_count=10
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate pin card — adhirachna
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=adhirachna&hide_border=true&bg_color=0d1117&title_color=10B981&icon_color=F59E0B&text_color=6EE7B7
          path: profile/pin-adhirachna.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate pin card — justflow
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=justflow&hide_border=true&bg_color=0d1117&title_color=10B981&icon_color=F59E0B&text_color=6EE7B7
          path: profile/pin-justflow.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate pin card — Dev-Wrapped
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=Dev-Wrapped&hide_border=true&bg_color=0d1117&title_color=10B981&icon_color=F59E0B&text_color=6EE7B7
          path: profile/pin-dev-wrapped.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate pin card — CarbonWise_Coach
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=CarbonWise_Coach&hide_border=true&bg_color=0d1117&title_color=10B981&icon_color=F59E0B&text_color=6EE7B7
          path: profile/pin-carbonwise-coach.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README stats cards [skip ci]" || exit 0
          git push
